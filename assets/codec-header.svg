<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title">
  <title id="title">Ash Rhodes. Builder of native macOS tools, built with AI. Open to remote work, Europe CET/CEST.</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#46F0A0" stroke-opacity=".06"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
    </pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46F0A0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#46F0A0" stop-opacity=".08"/>
      <stop offset="1" stop-color="#46F0A0" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
      .dim{fill:#2FA36E} .pri{fill:#46F0A0} .hi{fill:#D8FFE9} .soft{fill:#8FD9B4}
      .b{fill:#46F0A0;transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite alternate}
      @keyframes eq{from{transform:scaleY(.12)}to{transform:scaleY(1)}}
      .beam{animation:sweep 7s linear infinite}
      @keyframes sweep{from{transform:translateY(-80px)}to{transform:translateY(340px)}}
      @media (prefers-reduced-motion:reduce){.b,.beam{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="#050B08"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect class="beam" width="1200" height="80" fill="url(#beam)"/>

  <rect x="16.5" y="16.5" width="1167" height="287" fill="none" stroke="#1F6B4A"/>
  <path d="M16 46V16H46M1154 16H1184V46M1184 274V304H1154M46 304H16V274" fill="none" stroke="#46F0A0" stroke-width="3"/>

  <text x="44" y="50" class="m dim" font-size="13" letter-spacing="3">CODEC // SECURE CHANNEL // PROFILE.DAT</text>
  <circle cx="996" cy="45" r="5" fill="#46F0A0"><animate attributeName="opacity" values="1;.15;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="1156" y="50" text-anchor="end" class="m pri" font-size="13" letter-spacing="3">SIGNAL LOCKED</text>
  <path d="M44 66H1156" stroke="#1F6B4A" stroke-dasharray="2 6"/>

  <text x="44" y="146" class="m hi" font-size="64" font-weight="700" letter-spacing="8" filter="url(#glow)">ASH RHODES</text>
  <text x="46" y="188" class="m pri" font-size="18" letter-spacing="3">BUILDER // NATIVE macOS TOOLS // BUILT WITH AI</text>
  <text x="46" y="236" class="m soft" font-size="16">&gt; MISSION: build apps I like and want to use<tspan dx="8" class="pri">&#x2588;<animate attributeName="fill-opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/></tspan></text>
  <text x="46" y="282" class="m dim" font-size="12" letter-spacing="2">CALLSIGN MRASHRHODES · BASE EUROPE CET/CEST · STATUS OPEN TO REMOTE WORK</text>

  <rect x="860.5" y="84.5" width="295" height="192" fill="#0A1610" fill-opacity=".85" stroke="#1F6B4A"/>
  <path d="M860 100V84H876M1140 84H1156V100M1156 260V276H1140M876 276H860V260" fill="none" stroke="#46F0A0" stroke-width="2"/>
  <text x="878" y="108" class="m dim" font-size="11" letter-spacing="2">FREQ</text>
  <text x="1138" y="108" text-anchor="end" class="m dim" font-size="11" letter-spacing="2">MHz</text>
  <text x="1008" y="172" text-anchor="middle" class="m pri" font-size="58" font-weight="700" letter-spacing="2" filter="url(#glow)">140.85</text>
  <g>
    <rect class="b" x="882" y="222" width="11" height="30" style="animation-duration:1.1s;animation-delay:-0.00s"/>
    <rect class="b" x="898" y="208" width="11" height="44" style="animation-duration:0.9s;animation-delay:-0.37s"/>
    <rect class="b" x="914" y="200" width="11" height="52" style="animation-duration:1.3s;animation-delay:-0.74s"/>
    <rect class="b" x="930" y="214" width="11" height="38" style="animation-duration:1.0s;animation-delay:-1.11s"/>
    <rect class="b" x="946" y="196" width="11" height="56" style="animation-duration:1.4s;animation-delay:-0.18s"/>
    <rect class="b" x="962" y="210" width="11" height="42" style="animation-duration:0.95s;animation-delay:-0.55s"/>
    <rect class="b" x="978" y="204" width="11" height="48" style="animation-duration:1.2s;animation-delay:-0.92s"/>
    <rect class="b" x="994" y="218" width="11" height="34" style="animation-duration:1.05s;animation-delay:-1.29s"/>
    <rect class="b" x="1010" y="198" width="11" height="54" style="animation-duration:1.35s;animation-delay:-0.36s"/>
    <rect class="b" x="1026" y="212" width="11" height="40" style="animation-duration:0.85s;animation-delay:-0.73s"/>
    <rect class="b" x="1042" y="202" width="11" height="50" style="animation-duration:1.25s;animation-delay:-1.10s"/>
    <rect class="b" x="1058" y="216" width="11" height="36" style="animation-duration:1.0s;animation-delay:-0.17s"/>
    <rect class="b" x="1074" y="206" width="11" height="46" style="animation-duration:1.15s;animation-delay:-0.54s"/>
    <rect class="b" x="1090" y="196" width="11" height="56" style="animation-duration:1.45s;animation-delay:-0.91s"/>
    <rect class="b" x="1106" y="220" width="11" height="32" style="animation-duration:0.9s;animation-delay:-1.28s"/>
    <rect class="b" x="1122" y="208" width="11" height="44" style="animation-duration:1.2s;animation-delay:-0.35s"/>
  </g>
  <text x="878" y="268" class="m dim" font-size="10" letter-spacing="2">PTT</text>
  <text x="1138" y="268" text-anchor="end" class="m dim" font-size="10" letter-spacing="2">MEMORY</text>

  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect width="1200" height="320" fill="url(#vig)"/>
</svg>
